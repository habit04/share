[package]
name = "jcad-dwg-writer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "JcadDwgWriter"
path = "src/main.rs"

[dependencies]
acadrust = { version = "=0.6.4", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[patch.crates-io]
acadrust = { path = "vendor/acadrust" }

[profile.release]
opt-level = 2
lto = false
strip = true
panic = "unwind"

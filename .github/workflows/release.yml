name: Build installers

# Release pipeline (docs/RELEASE.md):
#   checks          the full test gate on the exact commit being released
#   build           the Windows installer from that same commit (needs: checks)
#   verify-artifacts all uploaded public assets checked together, including build-only dispatches
#   packaged-smoke  each installer installed / extracted on its own OS and driven end to end
#   release         publishes the installers, only after all of the above passed, and only when
#                   the release tag points at the commit the checks ran on; the release notes are
#                   the tag's CHANGELOG.md section (scripts/release-notes.mjs) and the verified
#                   signing status of each build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (leave empty to only build artifacts)'
        required: false
        default: ''
      require_signing:
        description: 'Require Windows publisher signing (fails if credentials are missing)'
        type: boolean
        required: false
        default: false
      native_helper_only:
        description: 'Build and sign only the portable Windows DWG helper (requires an empty tag; never publishes)'
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']

jobs:
  native-helper:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.native_helper_only == 'true'
    name: Signed portable DWG helper only
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
      TAG: ${{ github.event.inputs.tag }}
      REQUIRE_PUBLISHER_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the helper-only request and exact source commit
        shell: pwsh
        run: |
          if ($env:TAG) { throw 'native_helper_only requires an empty tag and cannot publish a release' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:SOURCE_SHA) { throw 'Checked out source differs from the dispatched commit' }
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Check the source and helper supply-chain/signing rules
        run: node node_modules/vitest/vitest.mjs run tests/dwg-writer-build.test.ts tests/dwg-writer-signing.test.ts tests/portable-dwg-host.test.ts tests/check-workflows.test.ts tests/signed-dwg-writer-verification.test.ts
      - name: Set up the pinned Windows DWG writer toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'RUSTUP_TOOLCHAIN=1.99.0-x86_64-pc-windows-gnu' >> $env:GITHUB_ENV
      - name: Require the configured Windows publisher
        id: signing
        run: node scripts/azure-signing.mjs
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
      # build:dwg-writer runs locked native guard/memory tests, signs the EXE, verifies
      # its exact publisher, and hashes the final signed bytes before copying the ASAR manifest.
      - name: Build, test and seal the signed native helper
        run: npm run build:dwg-writer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Verify the final signature, exact embedded manifest and source provenance
        run: node scripts/check-signed-dwg-writer.mjs
        env:
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-native-dwg-writer-${{ github.sha }}
          path: |
            release/dwg-writer/
            electron/dwg-writer-integrity.json
            native-helper-provenance.json
          if-no-files-found: error
          retention-days: 7

  checks:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.native_helper_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Checks on the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: The commit under test
        id: commit
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release checks run on $sha (${{ github.ref }})"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The Electron binary is needed for the end-to-end run.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Electron 44's package fetches its binary on first use, not at install (as in ci.yml): fetch
      # it here so the download does not happen inside the end-to-end run's launch timeout.
      - run: node node_modules/electron/install.js
      - name: DWG process containment on the release source
        run: xvfb-run -a npm run check:dwg-containment
      - name: Install Chromium for Playwright
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "import('playwright').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - run: npm run check:workflows
      - run: npm run lint
      - run: npm run typecheck:all
      - run: npm test
        env:
          JCAD_PERF_FACTOR: 2
      - run: npm run build
      - name: Dense drawing and project performance gate
        run: npm run bench:node
        env:
          JCAD_PERF_FACTOR: 2
      - name: Filesystem project read, parse and report profiling
        run: npm run bench:project
        env:
          JCAD_BENCH_ASSERT: 1
          JCAD_PERF_FACTOR: 2
          JCAD_BENCH_OUT: screenshots/bench
      - run: node scripts/build-site.mjs
      - run: npm run ui-check
      - run: node e2e/run-screenshots.mjs
      - run: npm run screenshot:compare
      - name: Browser interactive performance gate
        run: npm run bench
        env:
          JCAD_BENCH_ASSERT: 1
          JCAD_PERF_FACTOR: 2
          JCAD_BENCH_OUT: screenshots/bench
      - name: Electron end-to-end (virtual display)
        run: xvfb-run -a npm run e2e
        env:
          JCAD_E2E_OUT: e2e-output
      - run: xvfb-run -a npm run e2e:origin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-checks-output-node-${{ matrix.node }}
          path: |
            e2e-output/
            screenshots/diff/
          if-no-files-found: ignore

  # ASAR test build: only its inspection fuse and metadata differ from shipping.
  # It remains unpublished and outside the release output/upload contract.
  test-build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Set up the pinned Windows DWG writer toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'RUSTUP_TOOLCHAIN=1.99.0-x86_64-pc-windows-gnu' >> $env:GITHUB_ENV
      # The test ASAR contains the same portable writer and integrity manifest.
      - run: npm run dist:test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Fetch the legacy-seeding Electron binary before test launches
        run: node node_modules/electron/install.js
      - name: DWG process containment (Windows)
        run: npm run check:dwg-containment
      - name: Dedicated test-build Electron suite (Windows)
        run: npm run e2e:test-build
        env:
          JCAD_E2E_OUT: test-build-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-build-checks-${{ matrix.os }}
          path: test-build-output/
          if-no-files-found: warn

  build:
    needs: [checks, test-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            target: --win nsis
            artifact: JCad-Electrical-Windows
            glob: |
              release/*.exe
              release/*.blockmap
              release/latest*.yml
              release/JCad-Electrical-*-provenance.json
    runs-on: ${{ matrix.os }}
    env:
      # Publication always requires publisher identity. Unsigned Windows build-only rehearsals
      # remain explicit; require_signing also makes a build-only run fail closed.
      REQUIRE_PUBLISHER_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '' || github.event.inputs.require_signing == 'true' }}
    steps:
      # Exactly the commit the checks passed on.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Check that the release tag matches package.json
        if: ${{ github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $tag does not match package.json version $version (the updater compares both)."
            exit 1
          fi
      - run: npm run build
      - name: Turn on Azure signing when its secrets are set
        id: signing
        run: node scripts/azure-signing.mjs
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
      - name: Set up the pinned Windows DWG writer toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'RUSTUP_TOOLCHAIN=1.99.0-x86_64-pc-windows-gnu' >> $env:GITHUB_ENV
      - name: Build and seal the portable DWG writer before ASAR packing
        run: npm run build:dwg-writer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Read by the TrustedSigning PowerShell module.
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
      # Valid, and from the publisher the updater compares downloads against (app-update.yml publisherName).
      - name: Check the Windows signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          $bad = 0
          $expectedPublisher = $env:AZURE_PUBLISHER_NAME.Trim()
          $installers = @(Get-ChildItem release/*.exe -File)
          $applications = @(Get-ChildItem release/win-unpacked/*.exe -File)
          $helpers = @(Get-ChildItem release/win-unpacked/resources/dwg-writer/JcadDwgWriter.exe -File)
          if (!$expectedPublisher -or !$installers.Count -or !$applications.Count -or $helpers.Count -ne 1) { Write-Error 'Missing trusted publisher or executables to verify'; exit 1 }
          foreach ($f in $installers + $applications + $helpers) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            $publisher = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
            if ($sig.Status -ne 'Valid' -or ![string]::Equals($publisher, $expectedPublisher, [System.StringComparison]::Ordinal)) { $bad++ }
          }
          if ($bad) { Write-Error "$bad executable(s) lack a valid signature from the configured updater publisher"; exit 1 }
      - name: Record tested source, checksums and verified signing status
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
          WINDOWS_SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          status=unsigned
          if [ "$PLATFORM" = Windows ] && [ "$WINDOWS_SIGNED" = true ]; then status=authenticode-verified; fi
          node scripts/release-provenance.mjs build release "$PLATFORM" "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # This gate also runs when workflow_dispatch has an empty tag: missing metadata or blockmaps
  # must fail a build-only rehearsal, before publication is enabled.
  verify-artifacts:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: JCad-Electrical-*
      - name: Verify all uploaded assets against the tested source SHA
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: node scripts/release-provenance.mjs verify artifacts --policy windows-only
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-provenance
          path: |
            artifacts/release-provenance.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  # Install the Windows NSIS package and run fixed shipping probes without inspection.
  # The broad Playwright suite runs in the separate unpublished test ASAR.
  packaged-smoke:
    needs: [checks, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact: JCad-Electrical-Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The test scripts and fixtures of the same commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The application comes from the installer; stock Electron seeds the legacy origin test profile.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installers
      - name: Fetch the legacy-seeding Electron binary before shipping probes
        run: node node_modules/electron/install.js
      - name: DWG process containment on this native runner (Windows)
        run: npm run check:dwg-containment
      - name: Verify AutoCAD is absent before installed shipping probes
        shell: pwsh
        run: ./scripts/check-no-autocad.ps1 -EvidencePath packaged-smoke-output/no-autocad-inventory.json
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
      - name: Packaged smoke test (Windows)
        run: node scripts/packaged-smoke.mjs installers
        env:
          JCAD_SMOKE_OUT: packaged-smoke-output
          JCAD_SMOKE_REQUIRE_SHIPPING: 1
          JCAD_SMOKE_NATIVE_ONLY: '1'
          JCAD_SMOKE_EXPECT_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: packaged-smoke-output/
          if-no-files-found: warn

  release:
    if: github.event.inputs.native_helper_only != 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    needs: [checks, test-build, build, packaged-smoke, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Publish only what was tested: the tag must point at the commit the checks ran on (a pushed
      # tag that moved since, or an existing tag elsewhere for a manual run, stops the release).
      - name: Verify the tag points at the tested commit
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TESTED: ${{ needs.checks.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --force --prune --prune-tags --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$tagged" != "$TESTED" ]; then
              echo "::error::Tag $TAG points at $tagged, but the checks and installers are from $TESTED."
              exit 1
            fi
            echo "Tag $TAG points at the tested commit $TESTED."
          elif [ "$EVENT" = "push" ]; then
            echo "::error::Tag $TAG no longer exists on the remote."
            exit 1
          else
            echo "Tag $TAG does not exist yet; it will be created at the tested commit $TESTED."
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: JCad-Electrical-*
      # Verify every platform's source SHA, shipping fuses and downloaded bytes before the
      # release notes consume the resulting aggregate signing record.
      - name: Verify every platform artifact against the tested source SHA
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: node scripts/release-provenance.mjs verify artifacts --policy windows-only --require-signing
      # A tag without its own CHANGELOG.md section stops publication. The downloads and
      # single Verified build list come from the verified Windows-only aggregate.
      - name: Release notes from CHANGELOG.md and verified provenance
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" --strict --provenance artifacts/release-provenance.json --out release-notes.md
      - name: Sign provenance for the complete verified release
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/**/*
      - name: Include the signed attestation bundle in the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" artifacts/release-provenance.sigstore.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.checks.outputs.sha }}
          name: JCad Electrical ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true

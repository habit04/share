name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (leave empty to only build artifacts)'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            artifact: JCad-Electrical-Windows
            glob: |
              release/*.exe
              release/*.exe.blockmap
              release/latest*.yml
          - os: macos-latest
            target: --mac dmg --arm64 --x64
            artifact: JCad-Electrical-macOS
            glob: |
              release/*.dmg
              release/latest*.yml
          - os: ubuntu-latest
            target: --linux AppImage deb
            artifact: JCad-Electrical-Linux
            glob: |
              release/*.AppImage
              release/*.deb
              release/latest*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: JCad Electrical ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/**/*

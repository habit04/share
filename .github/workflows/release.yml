name: Build installers

# Release pipeline (docs/RELEASE.md):
#   checks          the full test gate on the exact commit being released
#   build           installers for Windows, macOS and Linux from that same commit (needs: checks)
#   verify-artifacts all uploaded public assets checked together, including build-only dispatches
#   packaged-smoke  each installer installed / extracted on its own OS and driven end to end
#   release         publishes the installers, only after all of the above passed, and only when
#                   the release tag points at the commit the checks ran on; the release notes are
#                   the tag's CHANGELOG.md section (scripts/release-notes.mjs) and the verified
#                   signing status of each build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (leave empty to only build artifacts)'
        required: false
        default: ''
      require_signing:
        description: 'Require Windows publisher signing and macOS Developer ID/notarization (fails if credentials are missing)'
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Checks on the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: The commit under test
        id: commit
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release checks run on $sha (${{ github.ref }})"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The Electron binary is needed for the end-to-end run.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Electron 44's package fetches its binary on first use, not at install (as in ci.yml): fetch
      # it here so the download does not happen inside the end-to-end run's launch timeout.
      - run: node node_modules/electron/install.js
      - name: DWG process containment on the release source
        run: xvfb-run -a npm run check:dwg-containment
      - name: Install Chromium for Playwright
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "import('playwright').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - run: npm run check:workflows
      - run: npm run lint
      - run: npm run typecheck:all
      - run: npm test
        env:
          JCAD_PERF_FACTOR: 2
      - run: npm run build
      - name: Dense drawing and project performance gate
        run: npm run bench:node
        env:
          JCAD_PERF_FACTOR: 2
      - name: Filesystem project read, parse and report profiling
        run: npm run bench:project
        env:
          JCAD_BENCH_ASSERT: 1
          JCAD_PERF_FACTOR: 2
          JCAD_BENCH_OUT: screenshots/bench
      - run: node scripts/build-site.mjs
      - run: npm run ui-check
      - run: node e2e/run-screenshots.mjs
      - run: npm run screenshot:compare
      - name: Browser interactive performance gate
        run: npm run bench
        env:
          JCAD_BENCH_ASSERT: 1
          JCAD_PERF_FACTOR: 2
          JCAD_BENCH_OUT: screenshots/bench
      - name: Electron end-to-end (virtual display)
        run: xvfb-run -a npm run e2e
        env:
          JCAD_E2E_OUT: e2e-output
      - run: xvfb-run -a npm run e2e:origin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-checks-output-node-${{ matrix.node }}
          path: |
            e2e-output/
            screenshots/diff/
          if-no-files-found: ignore

  # ASAR test build: only its inspection fuse and metadata differ from shipping.
  # It remains unpublished and outside the release output/upload contract.
  test-build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run dist:test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Fetch the legacy-seeding Electron binary before test launches
        run: node node_modules/electron/install.js
      - name: DWG process containment (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:dwg-containment
      - name: DWG process containment (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run check:dwg-containment
      - name: Dedicated test-build Electron suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e:test-build
        env:
          JCAD_E2E_OUT: test-build-output
      - name: Dedicated test-build Electron suite (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run e2e:test-build
        env:
          JCAD_E2E_OUT: test-build-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-build-checks-${{ matrix.os }}
          path: test-build-output/
          if-no-files-found: warn

  build:
    needs: [checks, test-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            target: --win nsis
            artifact: JCad-Electrical-Windows
            glob: |
              release/*.exe
              release/*.blockmap
              release/latest*.yml
              release/JCad-Electrical-*-provenance.json
          - os: macos-latest
            platform: macOS
            target: --mac dmg --arm64 --x64
            artifact: JCad-Electrical-macOS
            glob: |
              release/*.dmg
              release/*.blockmap
              release/latest*.yml
              release/JCad-Electrical-*-provenance.json
          - os: ubuntu-latest
            platform: Linux
            target: --linux AppImage deb
            artifact: JCad-Electrical-Linux
            glob: |
              release/*.AppImage
              release/*.deb
              release/*.blockmap
              release/latest*.yml
              release/JCad-Electrical-*-provenance.json
    runs-on: ${{ matrix.os }}
    env:
      # Publication always requires publisher identity. Unsigned/ad-hoc build-only rehearsals
      # remain explicit; require_signing also makes a build-only run fail closed.
      REQUIRE_PUBLISHER_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '' || github.event.inputs.require_signing == 'true' }}
      # macOS Developer ID signing + notarization runs only when all five secrets exist (docs/CODE-SIGNING.md).
      # Secrets cannot be tested in a step's `if:`, so the job computes a flag the steps read from env.
      HAS_APPLE: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      # Exactly the commit the checks passed on.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Check that the release tag matches package.json
        if: ${{ github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $tag does not match package.json version $version (the updater compares both)."
            exit 1
          fi
      - run: npm run build
      - name: Require macOS signing inputs when requested
        if: runner.os == 'macOS'
        run: node scripts/check-apple-signing.mjs
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Turn on Azure signing when its secrets are set
        id: signing
        if: runner.os == 'Windows'
        run: node scripts/azure-signing.mjs
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
      - run: npx electron-builder ${{ matrix.target }} --publish never
        # Unsigned path (unchanged): every OS without the Apple secrets. macOS gets the ad-hoc signature from scripts/afterPack.cjs.
        if: ${{ runner.os != 'macOS' || env.HAS_APPLE != 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Read by the TrustedSigning PowerShell module; empty on macOS and Linux.
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
      # Valid, and from the publisher the updater compares downloads against (app-update.yml publisherName).
      - name: Check the Windows signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          $bad = 0
          $expectedPublisher = $env:AZURE_PUBLISHER_NAME.Trim()
          $installers = @(Get-ChildItem release/*.exe -File)
          $applications = @(Get-ChildItem release/win-unpacked/*.exe -File)
          if (!$expectedPublisher -or !$installers.Count -or !$applications.Count) { Write-Error 'Missing trusted publisher or executables to verify'; exit 1 }
          foreach ($f in $installers + $applications) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            $publisher = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
            if ($sig.Status -ne 'Valid' -or ![string]::Equals($publisher, $expectedPublisher, [System.StringComparison]::Ordinal)) { $bad++ }
          }
          if ($bad) { Write-Error "$bad executable(s) lack a valid signature from the configured updater publisher"; exit 1 }
      - name: Build, sign and notarize (macOS, Developer ID)
        if: ${{ runner.os == 'macOS' && env.HAS_APPLE == 'true' }}
        # package.json keeps hardenedRuntime false for the ad-hoc build; on this runner only, the signed build
        # turns on the hardened runtime with build/entitlements.mac.plist. The CSC_LINK certificate goes into a
        # private, temporary keychain, using that keychain's own password for its partition list.
        # electron-builder then signs with that identity (CSC_KEYCHAIN,
        # CSC_NAME = its SHA-1; the ad-hoc afterPack hook steps aside because CSC_NAME is set) and notarizes (and
        # staples) because APPLE_ID / _APP_SPECIFIC_PASSWORD / _TEAM_ID are set.
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/mac-signing-config.mjs
          scratch="$(mktemp -d "$RUNNER_TEMP/jcad-signing.XXXXXX")"
          keychain="$scratch/signing.keychain-db"
          cert="$scratch/signing.p12"
          kc_password="$(openssl rand -base64 32)"
          original_keychains=()
          while IFS= read -r item; do
            original_keychains+=("$item")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          cleanup_signing() {
            rm -f "$cert" "$scratch/DeveloperIDG2CA.cer" "$scratch/DeveloperIDCA.cer"
            security list-keychains -d user -s "${original_keychains[@]}" 2> /dev/null || true
            security delete-keychain "$keychain" 2> /dev/null || true
            rmdir "$scratch" 2> /dev/null || true
          }
          trap cleanup_signing EXIT
          case "$CSC_LINK" in
            https://*) curl -fsSL --retry 3 -o "$cert" "$CSC_LINK" ;;
            *) node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.CSC_LINK, 'base64'))" "$cert" ;;
          esac
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$cert"
          # Apple's Developer ID intermediates, so either issuing chain can be built.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL --retry 3 -o "$scratch/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$scratch/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::CSC_LINK holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "Developer ID signing identity: $identity"
          env -u CSC_LINK -u CSC_KEY_PASSWORD CSC_KEYCHAIN="$keychain" CSC_NAME="$identity" npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify the macOS signature and notarization ticket
        if: ${{ runner.os == 'macOS' && env.HAS_APPLE == 'true' }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then echo "No .app bundle under release/"; exit 1; fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
            echo "$signature" | grep 'Authority=Developer ID Application'
            echo "$signature" | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
            echo "$signature" | grep -E 'flags=.*runtime'
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
          images=(release/*.dmg)
          if [ ${#images[@]} -eq 0 ]; then echo "No disk image under release/"; exit 1; fi
          for image in "${images[@]}"; do
            codesign --verify --strict --verbose=2 "$image"
            signature="$(codesign -dv --verbose=4 "$image" 2>&1)"
            echo "$signature" | grep 'Authority=Developer ID Application'
            echo "$signature" | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          done
      - name: Verify the macOS ad-hoc seal after fuse changes
        if: ${{ runner.os == 'macOS' && env.HAS_APPLE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then echo "No .app bundle under release/"; exit 1; fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - name: Record the minimum macOS version in latest-mac.yml
        if: runner.os == 'macOS'
        run: node scripts/mac-update-info.mjs release
      - name: Record tested source, checksums and verified signing status
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
          WINDOWS_SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          status=unsigned
          if [ "$PLATFORM" = Windows ] && [ "$WINDOWS_SIGNED" = true ]; then status=authenticode-verified; fi
          if [ "$PLATFORM" = macOS ]; then
            status=ad-hoc
            if [ "$HAS_APPLE" = true ]; then status=developer-id-notarized; fi
          fi
          node scripts/release-provenance.mjs build release "$PLATFORM" "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # This gate also runs when workflow_dispatch has an empty tag: missing metadata or blockmaps
  # must fail a build-only rehearsal, before publication is enabled.
  verify-artifacts:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: JCad-Electrical-*
      - name: Verify all uploaded assets against the tested source SHA
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: node scripts/release-provenance.mjs verify artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-provenance
          path: |
            artifacts/release-provenance.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  # Install (Windows: NSIS silently), mount (macOS: hdiutil) or extract (Linux: AppImage, deb) the
  # installers just built retain their signed shipping fuses. Fixed runtime/save/restart probes
  # run without inspection; the broader Playwright suite belongs to the separate test ASAR.
  # Each Mac architecture is mandatory on its own native runner; Rosetta is not a release gate.
  packaged-smoke:
    needs: [checks, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact: JCad-Electrical-Windows
          - os: macos-15
            arch: arm64
            artifact: JCad-Electrical-macOS
          - os: macos-15-intel
            arch: x64
            artifact: JCad-Electrical-macOS
          - os: ubuntu-latest
            arch: x64
            artifact: JCad-Electrical-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The test scripts and fixtures of the same commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The application comes from the installer; stock Electron seeds the legacy origin test profile.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installers
      - name: Fetch the legacy-seeding Electron binary before shipping probes
        run: node node_modules/electron/install.js
      - name: DWG process containment on this native runner (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:dwg-containment
      - name: DWG process containment on this native runner (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run check:dwg-containment
      - name: Packaged smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/packaged-smoke.mjs installers
        env:
          JCAD_SMOKE_OUT: packaged-smoke-output
          JCAD_SMOKE_REQUIRE_SHIPPING: 1
          JCAD_SMOKE_NATIVE_ONLY: '1'
          JCAD_SMOKE_EXPECT_ARCH: ${{ matrix.arch }}
      - name: Packaged smoke test (Windows, macOS)
        if: runner.os != 'Linux'
        run: node scripts/packaged-smoke.mjs installers
        env:
          JCAD_SMOKE_OUT: packaged-smoke-output
          JCAD_SMOKE_REQUIRE_SHIPPING: 1
          JCAD_SMOKE_NATIVE_ONLY: '1'
          JCAD_SMOKE_EXPECT_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: packaged-smoke-output/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: [checks, test-build, build, packaged-smoke, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.checks.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Publish only what was tested: the tag must point at the commit the checks ran on (a pushed
      # tag that moved since, or an existing tag elsewhere for a manual run, stops the release).
      - name: Verify the tag points at the tested commit
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TESTED: ${{ needs.checks.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --force --prune --prune-tags --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$tagged" != "$TESTED" ]; then
              echo "::error::Tag $TAG points at $tagged, but the checks and installers are from $TESTED."
              exit 1
            fi
            echo "Tag $TAG points at the tested commit $TESTED."
          elif [ "$EVENT" = "push" ]; then
            echo "::error::Tag $TAG no longer exists on the remote."
            exit 1
          else
            echo "Tag $TAG does not exist yet; it will be created at the tested commit $TESTED."
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: JCad-Electrical-*
      # Verify every platform's source SHA, shipping fuses and downloaded bytes before the
      # release notes consume the resulting aggregate signing record.
      - name: Verify every platform artifact against the tested source SHA
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: node scripts/release-provenance.mjs verify artifacts
      # A tag without its own CHANGELOG.md section stops publication. The macOS first-launch
      # sentence and the single Verified build list come from the verified aggregate.
      - name: Release notes from CHANGELOG.md and verified provenance
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" --strict --provenance artifacts/release-provenance.json --out release-notes.md
      - name: Sign provenance for the complete verified release
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/**/*
      - name: Include the signed attestation bundle in the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" artifacts/release-provenance.sigstore.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.checks.outputs.sha }}
          name: JCad Electrical ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true

name: Website (GitHub Pages)

# Builds the landing page (site/) and the browser edition (Vite, mode "site") into site-dist/
# and deploys it to GitHub Pages: https://habit04.github.io/share/
#
# First time only: Settings > Pages > Build and deployment > Source must be "GitHub Actions"
# (configure-pages with `enablement: true` tries to switch it on for you when the token may).

on:
  workflow_dispatch:
  push:
    branches: ['claude/autocad-program-feasibility-53w7j7']
    paths:
      - 'site/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # configure-pages (enablement: true) needs pages: write to switch Pages on.
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-dist

  deploy:
    # deploy-pages publishes the Pages deployment and requests its OIDC token.
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

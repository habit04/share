name: Feature request
description: A tool, symbol, report or behaviour that is missing
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to be able to do
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: How another program does it (optional)
      description: e.g. the AutoCAD Electrical command or dialog, a screenshot, a sample drawing.
  - type: input
    id: version
    attributes:
      label: JCad Electrical version

name: Bug report
description: Something is wrong, crashes, or draws / numbers / reports incorrectly
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do and what went wrong? Include the command you ran (e.g. AEWIRENO, TRIM).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead (what AutoCAD Electrical does is a good reference).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Run ...
        3. Click ...
  - type: input
    id: version
    attributes:
      label: JCad Electrical version and system
      placeholder: "0.3.0, Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (filled in by Help > Report a Problem)
      description: Command history and captured errors. Drag a drawing (.dxf) or screenshot onto this box to attach it.
      render: text
